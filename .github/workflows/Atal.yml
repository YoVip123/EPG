name: Auto Generate Airtel EPG

on:
  schedule:
    - cron: '0 */16 * * *'   # every 6 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install unzip
      run: sudo apt-get update && sudo apt-get install -y unzip

    - name: Extract ZIP Securely
      run: unzip -P "${{ secrets.ZIP_PASSWORD }}" AtelTvEpg.zip

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: pip install -r AtelTvEpg/requirements.txt

    - name: Run EPG Script
      run: python AtelTvEpg/Atalepg.py

    - name: Commit Output File
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add Airtelepg.xml.gz || echo "No file found"
        git commit -m "Auto update EPG" || echo "No changes"
        git push
