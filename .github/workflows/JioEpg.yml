name: Jio EPG Auto Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

# Prevent overlapping runs of THIS workflow
concurrency:
  group: jio-epg-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REQUIRED for rebase

      # Step 1: Trigger PHP (non-blocking)
      - name: Trigger EPG Generation
        run: |
          curl -s "${{ secrets.JIOGEN }}" > /dev/null

      # Step 2: Smart wait
      - name: Wait until file is ready
        run: |
          for i in {1..80}; do
            echo "Checking file..."

            if curl --silent --head --fail "${{ secrets.JIOGET }}" > /dev/null; then
              echo "File ready!"
              break
            fi

            sleep 6
          done

      # Step 3: Download file
      - name: Download jio.xml.gz
        run: |
          curl -L -o jio.xml.gz "${{ secrets.JIOGET }}"

      # Step 4: Verify
      - name: Check file
        run: |
          ls -lh jio.xml.gz

      # Step 5: Commit & Push (SAFE)
      - name: Commit & Push Output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Add file
          git add jio.xml.gz || echo "No file found"

          # Skip empty commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto Jio EPG update"
          git pull --rebase origin main
          git push origin main
