name: Jio EPG Auto Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"   # 6:00 AM IST (00:30 UTC)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Step 1: Trigger PHP (non-blocking)
      - name: Trigger EPG Generation
        run: |
          curl -s "https://api.vjayop.serv00.net/TV.php" > /dev/null &

      # Step 2: Smart wait (IMPORTANT)
      - name: Wait until file is ready
        run: |
          for i in {1..80}; do
            echo "Checking file..."

            if curl --silent --head --fail https://api.vjayop.serv00.net/jio.xml.gz > /dev/null; then
              echo "File ready!"
              break
            fi

            sleep 6
          done

      # Step 3: Download
      - name: Download jio.xml.gz
        run: |
          curl -L -o jio.xml.gz https://api.vjayop.serv00.net/jio.xml.gz

      # Step 4: Verify
      - name: Check file
        run: |
          ls -lh jio.xml.gz

      # Step 5: Commit & Push
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add jio.xml.gz
          git commit -m "Update Jio EPG" || echo "No changes"
          git push
