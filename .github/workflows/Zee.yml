name: Zee5 EPG Generator

on:
  workflow_dispatch:

  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  generate-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Zee5 EPG Generator
        env:
          ZEE5_ACCESS_TOKEN: ${{ secrets.ZEE5_ACCESS_TOKEN }}
        run: |
          python zee5EPGGEN.py

      - name: Commit Updated EPG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Zee5.xml.gz

          git diff --staged --quiet || git commit -m "Update Zee5 EPG"

          git push
