name: DishTV EPG v1

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true   # REQUIRED for git push

    - name: Install 7zip
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python dependencies
      run: |
        pip install requests
        pip install pytz

    - name: Decrypt protected source
      run: |
        7z x MAINPY/dishEPGgen.zip -p"${{ secrets.DISH_ZIP_PASSWORD }}" -y
        chmod +x dish.py

    - name: Run DishTV EPG generator
      run: |
        python dish.py
        echo "Files after generation:"
        ls -lh

    - name: Secure cleanup (destroy source)
      run: |
        shred -u dish.py
        rm -rf __pycache__ *.py

    - name: Commit generated EPG files
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git add channels.json dishtvEPG.xml.gz

        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto update DishTV EPG"
          git push
        fi
