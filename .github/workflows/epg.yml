name: DishTV EPG (Protected Source)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install 7zip
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Decrypt dishEPGgen.zip
      run: |
        7z x dishEPGgen.zip -p"${{ secrets.DISH_ZIP_PASSWORD }}" -y
        chmod +x dish.py

    - name: Run EPG generator
      run: |
        python dish.py
        ls -lh

    - name: Upload EPG output
      uses: actions/upload-artifact@v4
      with:
        name: DishTV-EPG
        path: |
          channels.json
          dishtvEPG.xml.gz

    - name: Secure cleanup
      run: |
        shred -u dish.py
        rm -rf __pycache__ *.py
